<script>
function parseGif(buf){
  const view = new DataView(buf);
  const bytes = new Uint8Array(buf);
  let pos = 0;
  function readStr(len){ let s=''; for(let i=0;i<len;i++) s+=String.fromCharCode(bytes[pos+i]); pos+=len; return s; }
  function skipSubBlocks(){
    while(true){
      const blockSize = bytes[pos]; pos+=1;
      if(blockSize===0) break;
      pos += blockSize;
    }
  }

  const header = readStr(6);
  if(header!=='GIF87a' && header!=='GIF89a') throw new Error(t('an_invalid'));
  const width = view.getUint16(pos,true); pos+=2;
  const height = view.getUint16(pos,true); pos+=2;
  const packed = bytes[pos]; pos+=1;
  pos+=1;
  pos+=1;
  const gctFlag = (packed & 0x80)!==0;
  const gctSize = Math.pow(2,(packed & 0x07)+1);
  if(gctFlag) pos += gctSize*3;

  let frameCount=0, loopCount=null, delays=[], comments=[];
  while(pos < bytes.length){
    const introducer = bytes[pos]; pos+=1;
    if(introducer===0x3B) break;
    if(introducer===0x21){
      const label = bytes[pos]; pos+=1;
      if(label===0xF9){
        pos+=1;
        pos+=1;
        const delay = view.getUint16(pos,true); pos+=2;
        pos+=1;
        pos+=1;
        delays.push(delay*10);
      } else if(label===0xFF){
        const blockSize = bytes[pos]; pos+=1;
        const appId = readStr(blockSize);
        const subSize = bytes[pos];
        if(appId.indexOf('NETSCAPE')===0 && subSize===3){
          pos+=1; pos+=1;
          loopCount = view.getUint16(pos,true); pos+=2;
          skipSubBlocks();
        } else {
          skipSubBlocks();
        }
      } else if(label===0xFE){
        let text='';
        while(true){
          const bs = bytes[pos]; pos+=1;
          if(bs===0) break;
          text += readStr(bs);
        }
        comments.push(text);
      } else {
        skipSubBlocks();
      }
    } else if(introducer===0x2C){
      frameCount++;
      pos+=8;
      const lctPacked = bytes[pos]; pos+=1;
      const lctFlag = (lctPacked & 0x80)!==0;
      const lctSize = Math.pow(2,(lctPacked & 0x07)+1);
      if(lctFlag) pos += lctSize*3;
      pos+=1;
      skipSubBlocks();
    } else {
      break;
    }
  }
  return {version:header, width, height, hasGlobalPalette:gctFlag, paletteColors: gctFlag?gctSize:0, frameCount, loopCount, delays, comments};
}

const dz = document.getElementById('dz');
const fileInput = document.getElementById('fileInput');
const status = document.getElementById('status');
dz.onclick = () => fileInput.click();
['dragover','dragleave','drop'].forEach(evt=>{
  dz.addEventListener(evt, e=>{
    e.preventDefault();
    dz.classList.toggle('drag', evt==='dragover');
    if(evt==='drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
});
fileInput.onchange = () => { if(fileInput.files[0]) handleFile(fileInput.files[0]); };

function handleFile(file){
  status.textContent = '';
  document.getElementById('preview').src = URL.createObjectURL(file);
  document.getElementById('body').style.display = 'block';
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const info = parseGif(reader.result);
      const totalDuration = info.delays.reduce((a,b)=>a+b, 0);
      const avgDelay = info.delays.length ? Math.round(totalDuration/info.delays.length) : 0;
      const rows = [
        [t('an_filesize'), (file.size/1024).toFixed(1)+' KB'],
        [t('an_version'), info.version],
        [t('an_dimensions'), `${info.width} × ${info.height} px`],
        [t('an_framecount'), info.frameCount],
        [t('an_avgdelay'), avgDelay+' ms'],
        [t('an_duration'), (totalDuration/1000).toFixed(2)+' s'],
        [t('an_loop'), info.loopCount===0 ? t('an_loop_infinite') : (info.loopCount===null ? t('an_loop_none') : info.loopCount+' '+t('an_loop_times'))],
        [t('an_palette'), info.hasGlobalPalette ? `${info.paletteColors} ${t('an_palette_colors')}` : t('an_palette_none')],
      ];
      if(info.comments.length) rows.push([t('an_comment'), info.comments.join(' | ')]);
      const table = document.getElementById('table');
      table.innerHTML = rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
    } catch(e){
      status.textContent = e.message || t('an_read_fail');
    }
  };
  reader.readAsArrayBuffer(file);
}
</script>
